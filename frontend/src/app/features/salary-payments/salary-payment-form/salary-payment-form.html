<h2>
  @if (selectedPayment()) {
    Edit Salary Payment
  } @else {
    Add Salary Payment
  }
</h2>

<form #salaryForm="ngForm" (ngSubmit)="submitForm()">
  <div>
    <label for="employee">Employee</label>

    <select
      id="employee"
      name="employee"
      [(ngModel)]="payment.EmpID"
      [disabled]="selectedPayment() !== null"
      required
    >
      <option [ngValue]="0" disabled>Select an employee</option>

      @for (employee of employees(); track employee.EmpID) {
        <option [ngValue]="employee.EmpID">{{ employee.FirstName }} {{ employee.LastName }}</option>
      }
    </select>
  </div>

  <div>
    <label for="year">Year</label>
    <input
      type="number"
      id="year"
      name="year"
      [(ngModel)]="payment.Year"
      [disabled]="selectedPayment() !== null"
      required
    />
  </div>

  <div>
    <label for="month">Month</label>
    <input
      type="number"
      id="month"
      name="month"
      min="1"
      max="12"
      [(ngModel)]="payment.Month"
      [disabled]="selectedPayment() !== null"
      required
    />
  </div>

  <div>
    <label for="amount">Amount</label>
    <input
      type="number"
      id="amount"
      name="amount"
      min="0.01"
      step="0.01"
      [(ngModel)]="payment.Amount"
      required
    />
  </div>

  <button type="submit" [disabled]="salaryForm.invalid">
    @if (selectedPayment()) {
      Update Salary Payment
    } @else {
      Add Salary Payment
    }
  </button>

  @if (selectedPayment()) {
    <button type="button" (click)="cancelEdit()">Cancel</button>
  }
</form>
