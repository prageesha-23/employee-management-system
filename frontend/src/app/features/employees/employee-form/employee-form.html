<h2>
  @if (selectedEmployee()) {
    Edit Employee
  } @else {
    Add Employee
  }
</h2>

<form #employeeForm="ngForm" (ngSubmit)="submitForm()">
  <div>
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" [(ngModel)]="employee.FirstName" required />
  </div>

  <div>
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" [(ngModel)]="employee.LastName" required />
  </div>

  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" [(ngModel)]="employee.Email" required />
  </div>

  <div>
    <label for="phone">Phone</label>
    <input type="text" id="phone" name="phone" [(ngModel)]="employee.Phone" required />
  </div>

  <div>
    <label for="department">Department</label>
    <input type="text" id="department" name="department" [(ngModel)]="employee.Department" />
  </div>

  <div>
    <label for="position">Position</label>
    <input type="text" id="position" name="position" [(ngModel)]="employee.Position" />
  </div>

  <div>
    <label for="hireDate">Hire Date</label>
    <input type="date" id="hireDate" name="hireDate" [(ngModel)]="employee.HireDate" />
  </div>

  <button type="submit" [disabled]="employeeForm.invalid">
    @if (selectedEmployee()) {
      Update Employee
    } @else {
      Add Employee
    }
  </button>
  @if (selectedEmployee()) {
    <button type="button" (click)="cancelEdit()">Cancel</button>
  }
</form>
