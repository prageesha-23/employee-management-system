<h1>Employee Management System</h1>

<app-employee-form
  [selectedEmployee]="selectedEmployee()"
  (employeeSaved)="onEmployeeSaved()"
  (editCancelled)="onEditCancelled()"
>
</app-employee-form>

<hr />

<app-employee-list
  [refreshTrigger]="employeeRefreshTrigger()"
  (employeeSelected)="onEmployeeSelected($event)"
>
</app-employee-list>

<hr />

<app-salary-payment-form
  [selectedPayment]="selectedSalaryPayment()"
  (paymentSaved)="onSalaryPaymentSaved()"
  (editCancelled)="onSalaryEditCancelled()"
>
</app-salary-payment-form>

<app-salary-payment-list
  [refreshTrigger]="salaryRefreshTrigger()"
  (paymentSelected)="onSalaryPaymentSelected($event)"
>
</app-salary-payment-list>
